name: build-installers

# Mac / Windows 用のインストーラ (.dmg / .msi) を自動で作るワークフロー。
#
# 使い方 (非エンジニア向け):
#   1. GitHub のリポジトリで「Actions」タブを開く
#   2. 左の一覧から「build-installers」を選ぶ
#   3. 右の「Run workflow」ボタンを押す
#   4. 数分待つと、実行結果のページ下部「Artifacts」から
#      インストーラをダウンロードできる
#
# タグ (例: v0.1.0) を push した場合は、GitHub の Release に
# インストーラが自動で添付されます (下書きとして作成)。

on:
  # 手動実行 (Actions タブのボタン)
  workflow_dispatch:
  # タグを付けたら自動でリリース作成
  push:
    tags:
      - 'v*'
  # desktop/ や Python 側を変更したときに、壊れていないか自動確認
  pull_request:
    paths:
      - 'desktop/**'
      - 'jp_pii_mask/**'
      - 'scripts/**'
      - 'インストーラを作る.*'
      - '.github/workflows/**'

# tauri-action がリリースを作成するために必要。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact: 'windows-installer'
            # Windows: .msi (WiX) と setup.exe (NSIS) の両方を作る。
            args: '--bundles msi,nsis'
            shell: 'pwsh'
          - platform: 'macos-latest'
            artifact: 'macos-installer'
            # macOS: Apple Silicon / Intel の両方で動く .dmg を作る。
            args: '--bundles dmg --target universal-apple-darwin'
            shell: 'bash'

    runs-on: ${{ matrix.platform }}

    steps:
      # ----------------------------------------------------------------
      # 0) ソースを取得
      # ----------------------------------------------------------------
      - name: ソースを取得
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1) Python (サイドカーのビルドに使う)
      # ----------------------------------------------------------------
      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------------------------------------------
      # 2) Rust (GUI のビルドに使う)
      # ----------------------------------------------------------------
      - name: Rust をセットアップ
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS は Intel / Apple Silicon の両方をビルドする。
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ビルドを速くするため、Rust のキャッシュを使う。
      - name: Rust のキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          # Cargo.toml はリポジトリ直下ではなくここにある。
          workspaces: 'desktop/src-tauri -> target'

      # ----------------------------------------------------------------
      # 3) セットアップ + サイドカー + 型検査
      #
      #    手元と同じスクリプトを実行する。--check-only なので
      #    インストーラは作らず、ここまでで止まる (最初の関門)。
      #    サイドカーはこの時点で Tauri の期待する場所に配置される。
      # ----------------------------------------------------------------
      - name: アプリを組み立てられるか確認
        shell: bash
        run: |
          PY=python
          command -v python >/dev/null 2>&1 || PY=python3
          "$PY" desktop/scripts/build-installer.py --check-only

      # ----------------------------------------------------------------
      # 4) GUI をビルドしてインストーラを作る
      #
      #    projectPath: Tauri プロジェクトのルート (src-tauri の親)。
      #      gitignore されていてはいけない。
      #    tauriScript: cargo tauri を使う (Node.js / npm は不要)。
      # ----------------------------------------------------------------
      - name: インストーラを作成
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'desktop'
          tauriScript: 'cargo tauri'
          # タグ push のときだけリリースを作る。手動実行では作らない。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('JP PII Mask {0}', github.ref_name) || '' }}
          releaseBody: |
            日本語 PII マスキング／自動復元プロキシのデスクトップアプリです。

            インストーラをダウンロードして実行してください。
            - Windows: `*-setup.exe` または `*.msi`
            - macOS: `*.dmg`

            ⚠️ 署名を行っていないため、初回起動時に OS の警告が出ます。
            - Windows: 「詳細情報」→「実行」
            - macOS: 右クリック →「開く」(またはシステム設定 → プライバシーとセキュリティ)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ----------------------------------------------------------------
      # 5) インストーラを成果物として保存
      #    リリースを作らない実行 (手動 / PR) でもダウンロードできるようにする。
      # ----------------------------------------------------------------
      - name: インストーラを成果物として保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app

      # ----------------------------------------------------------------
      # 6) 失敗したときに原因を追いやすくする
      # ----------------------------------------------------------------
      - name: 失敗時のログを保存
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.artifact }}-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            desktop/build/*.txt
            desktop/src-tauri/target/release/bundle/**/*.log
